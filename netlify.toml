# Netlify serves /privacy for privacy.html and 301s the .html URL to it by
# default, which is the behaviour this site is written for: every canonical,
# every og:url and every internal link is extensionless. The block below only
# makes that explicit so a future change to Netlify's defaults cannot quietly
# split the site across two sets of URLs.

[build]
  publish = "."

[build.processing]
  skip_processing = true

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
